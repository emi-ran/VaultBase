services:
  vaultbase:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vaultbase-app
    ports:
      - "3000:3000"
    volumes:
      # Persistent storage for SQLite metadata
      - ./data:/app/data
      # Location where gzipped backups will be stored
      - ./backups:/app/backups
    environment:
      - DATABASE_URL=file:/app/data/dev.db
      - APP_SECRET=your-vaultbase-production-secret-key-change-this
      - PORT=3000
    restart: unless-stopped
